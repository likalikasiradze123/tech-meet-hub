<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Meet & Greet Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>🚀 Tech Meet & Greet Hub</h1>
    <p>იპოვეთ და დაჯავშნეთ ტექნოლოგიური ღონისძიებები, ჰაკათონები და ვორქშოფები</p>
  </header>

  <!-- ფილტრაციის სექცია -->
  <section style="display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;">
    <div>
      <label for="category-filter"><b>ტექნოლოგია:</b></label>
      <select id="category-filter" style="padding: 8px; border-radius: 5px;">
        <option value="all">ყველა</option>
        <option value="AI">AI</option>
        <option value="Web Dev">Web Dev</option>
        <option value="Cybersecurity">Cybersecurity</option>
      </select>
    </div>

    <div>
      <label for="format-filter"><b>ფორმატი:</b></label>
      <select id="format-filter" style="padding: 8px; border-radius: 5px;">
        <option value="all">ყველა</option>
        <option value="Online">Online</option>
        <option value="In-person">In-person</option>
        <option value="Hybrid">Hybrid</option>
      </select>
    </div>
  </section>

  <main class="events-grid" id="events-grid">
    <!-- ივენთების ბარათები ჩაჯდება დინამიკურად app.js-ის საშუალებით -->
  </main>

  <!-- დაჯავშნის Modal -->
  <div id="booking-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      <h2 id="modal-event-title">ღონისძიების დაჯავშნა</h2>
      <form id="booking-form">
        <label for="user-name">სახელი, გვარი:</label>
        <input type="text" id="user-name" required placeholder="მაგ: გიორგი ბერიძე">

        <label for="user-email">ელ-ფოსტა:</label>
        <input type="email" id="user-email" required placeholder="example@mail.com">

        <button type="submit" class="btn-submit">დადასტურება</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
