<!-- 🎟️ 2. ციფრული ბილეთის Modal (დაჯავშნის შემდეგ) -->
  <div id="ticket-modal" class="modal">
    <div class="modal-content ticket-modal-content">
      <span class="close-btn" id="close-ticket">&times;</span>
      <h2 style="text-align: center; margin-bottom: 15px;" data-i18n="yourTicketTitle">🎟️ თქვენი ციფრული ბილეთი</h2>
      
      <div class="ticket-card" id="digital-ticket">
        <div class="ticket-header">
          <span class="ticket-badge">VIP PASS</span>
          <h3 id="ticket-event-title">AI & Future Tech Summit</h3>
        </div>
        <div class="ticket-body">
          <p>👤 <b data-i18n="labelHolder">მფლობელი:</b> <span id="ticket-user-name">-</span></p>
          <p>📅 <b data-i18n="labelDate">თარიღი:</b> <span id="ticket-event-date">-</span></p>
          <p>📍 <b data-i18n="labelLocation">ადგილი:</b> <span id="ticket-event-location">-</span></p>
          <p>🆔 <b data-i18n="labelTicketId">ბილეთის ID:</b> <code id="ticket-id-code">#TKT-0000</code></p>
        </div>
        <div class="ticket-qr-container">
          <img id="ticket-qr-img" src="" alt="QR Code">
          <small data-i18n="qrScanTip">წარადგინეთ ეს QR კოდი შესასვლელთან</small>
        </div>
      </div>

      <!-- 📥 ჩამოტვირთვის / დაბეჭდვის ღილაკი -->
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button id="download-ticket-btn" class="btn-submit" style="flex: 1; background: #4f46e5;">📥 <span data-i18n="btnDownload">ბილეთის ჩამოტვირთვა</span></button>
        <button id="close-ticket-btn" class="btn-secondary" style="flex: 1;" data-i18n="btnClose">დახურვა</button>
      </div>
    </div>
  </div>
